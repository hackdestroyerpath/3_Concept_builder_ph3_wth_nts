name: Deploy Concept Builder

on:
  push:
    paths:
      - '.cb_payload/ready.flag'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct package
        run: |
          set -euo pipefail
          test -d .cb_payload/chunks
          ls .cb_payload/chunks/part_*.b64 >/dev/null
          cat .cb_payload/chunks/part_*.b64 > /tmp/concept_builder_package.b64
          base64 -d /tmp/concept_builder_package.b64 > /tmp/concept_builder_package.zip
          echo "8373a99e238dc18b109e331dc0e96bc280742eee3f23643cd003e5e385192691  /tmp/concept_builder_package.zip" | sha256sum -c -

      - name: Materialize production tree
        run: |
          set -euo pipefail
          rm -rf /tmp/concept_builder_unpack
          mkdir -p /tmp/concept_builder_unpack
          unzip -q /tmp/concept_builder_package.zip -d /tmp/concept_builder_unpack
          test -d "/tmp/concept_builder_unpack/Concept Builder"
          rm -rf "Concept Builder"
          cp -R "/tmp/concept_builder_unpack/Concept Builder" "Concept Builder"
          file_count=$(find "Concept Builder" -type f | wc -l | tr -d ' ')
          test "$file_count" = "33"
          find "Concept Builder" -type f | sort > /tmp/concept_builder_files.txt
          grep -q '^Concept Builder/README.md$' /tmp/concept_builder_files.txt
          grep -q '^Concept Builder/State/service_validation_report.md$' /tmp/concept_builder_files.txt

      - name: Remove temporary deploy carrier
        run: |
          set -euo pipefail
          rm -rf .cb_payload
          rm -f .cb_deploy_probe_b64.tmp
          rm -f .github/workflows/deploy_concept_builder.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit production tree
        run: |
          set -euo pipefail
          git config user.name "Concept Builder Executor"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Implement Concept Builder production tree"
          git push
